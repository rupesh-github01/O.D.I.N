services:

  postgres:
    image: postgres:16
    container_name: odin-postgres

    environment:
      POSTGRES_USER: odin
      POSTGRES_PASSWORD: odinpassword
      POSTGRES_DB: odin_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    container_name: odin-qdrant

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: